<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email alerts</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <div id="notice"></div>
  <div id="head"></div>

  <div id="preview"></div>

  <details class="card" id="settings">
    <summary>Who it goes to, and when</summary>
    <div class="stack" style="margin-top:14px">
      <div class="filters">
        <div><label for="to">Send to</label><input id="to" type="email" placeholder="you@example.com"></div>
        <div><label for="runway">Warn when the money runs out within this many days</label><input id="runway" type="number"></div>
        <div><label for="large">Flag a transaction at or above</label><input id="large" type="number" step="0.01"></div>
      </div>
      <div class="sub" id="switches">
        <div class="s" style="margin-bottom:2px">Send an email when</div>
        <label class="tick"><input type="checkbox" id="overspend"> A bucket goes over budget</label>
        <label class="tick"><input type="checkbox" id="syncfail"> A sync fails</label>
        <label class="tick"><input type="checkbox" id="unreviewed"> Things are waiting to be reviewed</label>
      </div>
      <div class="row" style="flex-wrap:wrap">
        <button class="primary" id="save">Save</button>
        <button id="test">Send a test</button>
        <button id="run">Run the checks now</button>
        <span class="muted small" id="state"></span>
      </div>
    </div>
  </details>

  <div id="log"></div>
</main>
<script type="module" src="/alerts.js"></script>
</body>
</html>
