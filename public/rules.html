<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rules</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <div id="notice"></div>

  <div class="card stack">
    <strong>New rule</strong>
    <div class="filters">
      <div><label for="name">Name</label><input id="name" style="width:100%" placeholder="Woolworths is groceries"></div>
      <div><label for="field">Look at</label><select id="field" style="width:100%">
        <option value="any">Anything</option><option value="description">Description</option>
        <option value="merchant_name">Merchant</option><option value="reference">Reference</option>
        <option value="extended_description">Extended description</option>
      </select></div>
      <div><label for="type">Match</label><select id="type" style="width:100%">
        <option value="contains">contains</option><option value="equals">equals</option>
        <option value="starts_with">starts with</option><option value="regex">matches pattern</option>
      </select></div>
      <div><label for="value">Text</label><input id="value" style="width:100%" placeholder="WOOLWORTHS"></div>
      <div><label for="account">Account</label><select id="account" style="width:100%"><option value="">Any</option></select></div>
      <div><label for="direction">Direction</label><select id="direction" style="width:100%">
        <option value="">Any</option><option value="debit">Money out</option><option value="credit">Money in</option>
      </select></div>
      <div><label for="min">Min amount</label><input id="min" type="number" step="0.01" style="width:100%" placeholder="0.00"></div>
      <div><label for="max">Max amount</label><input id="max" type="number" step="0.01" style="width:100%" placeholder="0.00"></div>
      <div><label for="category">Set category</label><select id="category" style="width:100%"></select></div>
      <div><label for="rename">Rename to</label><input id="rename" style="width:100%" placeholder="optional"></div>
    </div>
    <div class="row">
      <button id="preview">Preview</button>
      <button class="primary" id="create">Create rule</button>
      <span class="muted" id="previewState"></span>
    </div>
    <div id="previewRows"></div>
  </div>

  <h2>Existing rules</h2>
  <div id="list"><p class="muted">Loading...</p></div>
</main>
<script type="module" src="/rules.js"></script>
</body>
</html>
