<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rules</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <div id="notice"></div>
  <div id="head"></div>
  <div id="list"></div>

  <details class="card" id="newRule">
    <summary>Write a rule</summary>
    <div class="stack" style="margin-top:14px">
      <div class="filters">
        <div><label for="value">When the description contains</label><input id="value" placeholder="WOOLWORTHS"></div>
        <div><label for="category">File it under</label><select id="category"></select></div>
        <div><label for="name">Call the rule</label><input id="name" placeholder="Woolworths is groceries"></div>
      </div>

      <details>
        <summary>Narrow it further</summary>
        <div class="filters" style="margin-top:12px">
          <div><label for="field">Look at</label><select id="field">
            <option value="description">Description</option><option value="any">Anything</option>
            <option value="merchant_name">Merchant</option><option value="reference">Reference</option>
            <option value="extended_description">Extended description</option>
          </select></div>
          <div><label for="type">Match</label><select id="type">
            <option value="contains">contains</option><option value="equals">equals</option>
            <option value="starts_with">starts with</option><option value="regex">matches pattern</option>
          </select></div>
          <div><label for="account">Only this account</label><select id="account"><option value="">Any</option></select></div>
          <div><label for="direction">Direction</label><select id="direction">
            <option value="">Any</option><option value="debit">Money out</option><option value="credit">Money in</option>
          </select></div>
          <div><label for="min">At least</label><input id="min" type="number" step="0.01" placeholder="0.00"></div>
          <div><label for="max">At most</label><input id="max" type="number" step="0.01" placeholder="0.00"></div>
          <div><label for="rename">Rename it to</label><input id="rename" placeholder="optional"></div>
        </div>
      </details>

      <div class="row" style="flex-wrap:wrap">
        <button id="preview">Show what it would catch</button>
        <button class="primary" id="create">Create it</button>
        <span class="muted small" id="previewState"></span>
      </div>
      <div id="previewRows"></div>
    </div>
  </details>
</main>
<script type="module" src="/rules.js"></script>
</body>
</html>
