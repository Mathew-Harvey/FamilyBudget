<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All transactions</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <div id="notice"></div>
  <div id="head"></div>
  <div id="unfiled"></div>

  <div class="sec">Find one</div>
  <details class="card" id="filterBox">
    <summary id="filterSummary">Everything, newest first</summary>
    <div class="stack" style="margin-top:14px">
      <div class="filters">
        <div><label for="search">Description contains</label><input id="search" type="search" placeholder="woolworths"></div>
        <div><label for="account">Account</label><select id="account"><option value="">All</option></select></div>
        <div><label for="category">Category</label><select id="category"></select></div>
        <div><label for="from">From</label><input id="from" type="date"></div>
        <div><label for="to">To</label><input id="to" type="date"></div>
        <div><label for="status">Status</label><select id="status">
          <option value="">All</option><option value="posted">Posted</option><option value="pending">Pending</option>
        </select></div>
        <div><label for="transfer">Transfers</label><select id="transfer">
          <option value="">All</option><option value="true">Transfers only</option><option value="false">Exclude transfers</option>
        </select></div>
      </div>
      <div class="row" style="flex-wrap:wrap">
        <button class="primary" id="apply">Apply</button>
        <button id="reset">Clear</button>
      </div>
    </div>
  </details>

  <div id="list"></div>
  <div class="row" style="margin-top:12px"><button id="more" style="display:none">Show more</button></div>
</main>
<script type="module" src="/transactions.js"></script>
</body>
</html>
