<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="login-wrap">
  <h2>Household budget</h2>
  <div id="notice"></div>
  <form id="login" class="card stack" autocomplete="on">
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required style="width:100%">
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required style="width:100%">
    </div>
    <button class="primary" type="submit">Sign in</button>
  </form>
</main>
<script type="module" src="/login.js"></script>
</body>
</html>
